version: "2"
sql:
  - engine: postgresql
    # The schema is the migrations': sqlc reads the same ones applied in
    # production, so a query that does not match the schema fails at generation
    # time and not on the server.
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        # The columns stay in Spanish because the database is NOT being touched:
        # renaming them would mean migrations over data already loaded, for nothing
        # in return. The translation happens here, when the Go is generated.
        rename:
          # Tipos enumerados de Postgres
          tipo_fuente: "SourceType"
          estado_fichero: "FileStatus"
          calidad_punto: "PointQuality"
          estado_dia: "DayStatus"
          # Tablas (dan nombre a las structs)
          trabajador: "Seller"
          sucursal: "Branch"
          # El espejo de PEDIDO y el cruce (migración 000009).
          pedido: "Order"
          pedido_cliente: "Client"
          vendedor_pedido: "SellerLink"
          visita: "Visit"
          pedido_sync: "OrderSync"
          sucursal_config: "BranchSettings"
          feriado: "Holiday"
          supervision: "Supervision"
          # Columnas
          trabajador_id: "SellerID"
          sucursal_id: "BranchID"
          supervisor_id: "SupervisorID"
          gestor_id: "ManagerID"
          nombre: "Name"
          fecha: "Date"
          estado: "Status"
          activa: "Active"
          activo: "Active"
          banderas: "Flags"
          cobertura: "Coverage"
          credencial: "Credential"
          desde: "From"
          hasta: "To"
          detalle: "Detail"
          inicio: "Start"
          fin: "End"
          duracion_min: "DurationMin"
          km_netos: "NetKm"
          puntos: "Points"
          puntos_total: "TotalPoints"
          puntos_validos: "ValidPoints"
          puntos_insertados: "InsertedPoints"
          primer_fix: "FirstFix"
          ultimo_fix: "LastFix"
          ultimo_barrido: "LastScan"
          ultimo_error: "LastError"
          cursor_modificado: "ModifiedCursor"
          lugar_texto: "PlaceLabel"
          radio_dispersion: "SpreadM"
          radio: "Radius"
          ruta_carpeta: "FolderPath"
          pista_alias: "AliasHint"
          alias_original: "OriginalAlias"
          origen_fecha: "DateSource"
          importado_at: "ImportedAt"
          calculado_at: "ComputedAt"
          min_movimiento: "MinMovement"
          min_parado: "MinStopped"
          huecos: "Gaps"
          hueco_minutos: "GapMinutes"
          tipo: "Type"
          tamano_bytes: "SizeBytes"
          ficheros_vistos: "FilesSeen"
          ficheros_nuevos: "FilesNew"
          ficheros_error: "FilesFailed"
          cliente_nombre: "ClientName"
          # Columnas del espejo de PEDIDO.
          ref: "Ref"
          codigo: "Code"
          direccion: "Address"
          municipio: "Municipality"
          zona: "Zone"
          folio: "Folio"
          cliente_id: "ClientID"
          vendedor_ref: "VendorRef"
          vendedor_codigo: "VendorCode"
          vendedor_nombre: "VendorName"
          requiere_domicilio: "NeedsDelivery"
          origen: "Origin"
          visitado: "Visited"
          distancia_m: "DistanceM"
          hora: "Time"
          minutos: "Minutes"
          clientes: "Clients"
          pedidos: "Orders"
          cruces: "Crosses"
          actualizado_at: "UpdatedAt"
          origen_actualizado_at: "SourceUpdatedAt"
          cliente_ref: "ClientRef"
          distancia_cliente_m: "ClientDistM"
          centroide_lat: "CentroidLat"
          centroide_lon: "CentroidLon"
          jornada_inicio: "WorkdayStart"
          jornada_fin: "WorkdayEnd"
          dias_laborables: "Workdays"
          es_vendedor: "IsSeller"
          cobertura_minima: "MinCoverage"
          cobertura_gap_min: "CoverageGapMin"
          escaso_km_netos: "LowNetKm"
          parada_minutos: "StopMinutes"
          parada_radio_m: "StopRadiusM"
          paso_minimo_m: "MinStepM"
          sin_mov_radio_m: "NoMoveRadiusM"
          sin_mov_span_min: "NoMoveSpanMin"
          visita_radio_m: "VisitRadiusM"
          max_velocidad_kmh: "MaxSpeedKmh"
          max_accuracy_m: "MaxAccuracyM"
          tolerancia_entrada_min: "EntryToleranceMin"
          tolerancia_salida_min: "ExitToleranceMin"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
