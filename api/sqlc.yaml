version: "2"
sql:
  - engine: postgresql
    # El esquema es el de las migraciones: sqlc lee las mismas que se aplican en
    # producción, así que si una consulta no casa con el esquema, falla al
    # generar y no en el servidor.
    schema: "migraciones"
    queries: "internal/almacen/consultas"
    gen:
      go:
        package: "almacen"
        out: "internal/almacen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
